listen_addresses = '*'
max_connections = 200

timezone = 'UTC'
log_timezone = 'UTC'
client_encoding = 'UTF8'

shared_buffers = 512MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 128MB
wal_buffers = 16MB
synchronous_commit = on

idle_in_transaction_session_timeout = 600s

log_min_duration_statement = 1000
